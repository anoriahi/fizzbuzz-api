; listen = 9000 et clear_env = no sont déjà définis par l'image officielle
[www]
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Utilisé par le healthcheck Docker (non exposé par nginx)
ping.path = /ping
pm.status_path = /status
